name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate and Commit Keystore if missing
        run: |
          if [ ! -f "app/debug.keystore" ]; then
            echo "Keystore not found. Generating a new permanent one..."
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add app/debug.keystore
            git commit -m "Auto-generate permanent debug keystore"
            git push
          else
            echo "Keystore already exists! Reusing the permanent keystore."
          fi

      - name: Print SHA-1 Fingerprint for Firebase
        run: keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
